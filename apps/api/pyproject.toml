[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "field-shift-api"
version = "0.1.0"
description = "Field Shift Togo - backend FastAPI + reference engine"
requires-python = ">=3.11"
# Runtime dependencies only (what FastAPI Cloud installs). The data pipeline (pandas, numpy,
# httpx) runs on the developer's PC: `pip install -e "apps/api[dev]"`.
dependencies = [
    "fastapi[standard]>=0.115",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "sqlalchemy[asyncio]>=2.0.25",
    "alembic>=1.13",
    "asyncpg>=0.29",
    "aiosqlite>=0.19",
]

[project.optional-dependencies]
pipeline = [
    "httpx>=0.27",
    "pandas>=2.1",
    "numpy>=1.26",
]
dev = [
    "httpx>=0.27",
    "pandas>=2.1",
    "numpy>=1.26",
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.9",
]

[tool.fastapi]
entrypoint = "app.main:app"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
ignore_missing_imports = true

[tool.ruff.lint]
ignore = ["B008"]  # FastAPI Depends() in defaults is idiomatic
